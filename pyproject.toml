[build-system]
requires = ["hatchling>=1.27"]  # 1.27 writes the License-Expression and License-File metadata
build-backend = "hatchling.build"

[project]
name = "atgeo"
version = "0.1.0"
description = "Client for the atgeo gazetteer, which searches places without telling the server what you searched for"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Schuyler Erle" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = ["urllib3>=2.2", "truststore>=0.10.1"]

[project.optional-dependencies]
async = ["aiohttp>=3.10"]

[project.urls]
Homepage = "https://github.com/schuyler/atgeo-sdk-python"
Source = "https://github.com/schuyler/atgeo-sdk-python"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.18", "aiohttp>=3.10"]
examples = ["requests>=2.32", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["src/atgeo"]

[tool.hatch.build.targets.sdist]
include = ["src/atgeo", "tests", "examples", "scripts", "README.md", "CONFORMANCE.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # counts and magic numbers: the contract is full of both
    "PLW0603",                                              # module-level locks are set with `global`
    "RUF001", "RUF002", "RUF003",                           # Unicode lookalikes: the text tests are made of them
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples", "scripts"]

[[tool.mypy.overrides]]
module = ["requests.*", "httpx.*"]
ignore_missing_imports = true
